 <!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
     <meta http-equiv="Pragma" content="no-cache">
     <meta http-equiv="Expires" content="0">
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
     <!-- 提示：把 title 和页面里的“XX店”替换为实际店铺名，会显示在微信拦截页 -->
     <title>XX店 邻里福利群</title>
     <style>
         :root {
             --bg-cream: #FDF8F3;
             --bg-warm: #FFF4EB;
             --orange: #D97757;
             --orange-light: #FCE8DE;
             --green: #7A916E;
             --brown: #4A3F35;
             --brown-light: #6D6258;
             --card: #FFFFFF;
             --shadow: 0 8px 28px rgba(74, 63, 53, 0.08);
         }

         * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

         body {
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
             background: var(--bg-cream);
             color: var(--brown);
             line-height: 1.6;
             min-height: 100vh;
             padding-bottom: env(safe-area-inset-bottom, 0);
         }

         .top-banner {
             background: linear-gradient(160deg, #FFF0E5 0%, #FCE8DE 100%);
             padding: 42px 20px 60px;
             text-align: center;
             border-bottom-left-radius: 28px;
             border-bottom-right-radius: 28px;
         }

         .shop-name {
             display: inline-flex;
             align-items: center;
             gap: 8px;
             font-size: 15px;
             font-weight: 500;
             color: var(--orange);
             background: #fff;
             padding: 6px 14px;
             border-radius: 999px;
             margin-bottom: 14px;
             box-shadow: 0 2px 8px rgba(217, 119, 87, 0.10);
         }

         h1 {
             font-size: 28px;
             font-weight: 700;
             color: var(--brown);
             margin-bottom: 6px;
             letter-spacing: 0;
         }

         .tagline {
             font-size: 14px;
             color: var(--brown-light);
         }

         .container {
             max-width: 480px;
             margin: -42px auto 0;
             padding: 0 18px;
         }

         .steps {
             display: flex;
             justify-content: center;
             gap: 10px;
             margin-bottom: 24px;
             flex-wrap: wrap;
         }

         .step {
             display: flex;
             align-items: center;
             gap: 6px;
             font-size: 13px;
             color: var(--brown-light);
             background: #fff;
             padding: 7px 12px;
             border-radius: 999px;
             box-shadow: 0 2px 8px rgba(74, 63, 53, 0.05);
         }

         .step-num {
             width: 20px;
             height: 20px;
             display: grid;
             place-items: center;
             font-size: 11px;
             font-weight: 700;
             color: #fff;
             background: var(--orange);
             border-radius: 50%;
         }

         .card {
             background: var(--card);
             border-radius: 20px;
             padding: 26px 22px;
             margin-bottom: 18px;
             box-shadow: var(--shadow);
             text-align: center;
         }

         .card-header {
             margin-bottom: 18px;
         }

         .card-title {
             font-size: 20px;
             font-weight: 700;
             color: var(--brown);
             margin-bottom: 4px;
         }

         .card-subtitle {
             font-size: 13px;
             color: var(--brown-light);
         }

         .qr-frame {
             display: inline-block;
             background: #fff;
             border: 1px solid #F0E7E0;
             border-radius: 16px;
             padding: 10px;
             box-shadow: 0 4px 14px rgba(74, 63, 53, 0.05);
         }

         .qr-frame img {
             display: block;
             width: 260px;
             height: auto;
             max-width: 100%;
             border-radius: 10px;
         }

         .action-pill {
             display: inline-flex;
             align-items: center;
             gap: 6px;
             margin-top: 16px;
             background: var(--orange);
             color: #fff;
             font-size: 15px;
             font-weight: 600;
             padding: 11px 22px;
             border-radius: 999px;
             box-shadow: 0 4px 14px rgba(217, 119, 87, 0.25);
         }

         .hint {
             margin-top: 12px;
             font-size: 12px;
             color: var(--brown-light);
         }

         .card-alt {
             background: #FAF9F7;
             border: 1px solid #EDE8E2;
             box-shadow: none;
         }

         .card-alt .card-title {
             color: var(--green);
         }

         .card-alt .qr-frame {
             border-color: #E0E6DC;
         }

         .card-alt .action-pill {
             background: var(--green);
             box-shadow: 0 4px 14px rgba(122, 145, 110, 0.20);
         }

         .divider {
             display: flex;
             align-items: center;
             gap: 12px;
             margin: 6px 0 18px;
             color: #B8AEA4;
             font-size: 12px;
         }

         .divider::before, .divider::after {
             content: "";
             flex: 1;
             height: 1px;
             background: #ECE5DD;
         }

         .footer {
             text-align: center;
             padding: 14px 20px 34px;
             font-size: 12px;
             color: #B0A59A;
             line-height: 1.8;
         }

         @media (max-width: 360px) {
             h1 { font-size: 24px; }
             .qr-frame img { width: 220px; }
             .card { padding: 22px 16px; }
         }
     </style>
 </head>
 <body>

     <div class="top-banner">
         <div class="shop-name">🏠 社区好店</div>
         <h1>XX店 邻里福利群</h1>
         <p class="tagline">红包福利 · 优惠先知 · 邻里互助</p>
     </div>

     <div class="container">
         <div class="steps">
             <div class="step"><span class="step-num">1</span>长按二维码</div>
             <div class="step"><span class="step-num">2</span>识别图中二维码</div>
             <div class="step"><span class="step-num">3</span>加入群聊</div>
         </div>

         <div class="card">
             <div class="card-header">
                 <div class="card-title">🎁 本周福利群</div>
                 <div class="card-subtitle">每周更新群码，红包、秒杀、会员福利第一时间通知</div>
             </div>
             <div class="qr-frame">
                 <img src="qrcode_a_20260811.png" alt="本周福利群二维码" width="277" height="400">
             </div>
             <div class="action-pill">👆 长按识别二维码进群</div>
             <div class="hint">若提示群已满，请用下方方式联系老板</div>
         </div>

         <div class="divider">备用通道</div>

         <div class="card card-alt">
             <div class="card-header">
                 <div class="card-title">🙋 群满或过期？</div>
                 <div class="card-subtitle">添加老板个人微信，手动拉您进群</div>
             </div>
             <div class="qr-frame">
                 <img src="qrcode_b_20260811.png" alt="老板微信二维码" width="277" height="400">
             </div>
             <div class="action-pill">👆 长按识别添加好友</div>
         </div>
     </div>

     <div class="footer">
         群二维码每周更新 · 有问题随时联系老板<br>
         感谢街坊邻居们的支持与信任 🧡
     </div>

 </body>
 </html>
