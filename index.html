 <!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
     <meta http-equiv="Pragma" content="no-cache">
     <meta http-equiv="Expires" content="0">
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
     <title>盛达布业 床品到货通知群</title>
     <style>
         :root {
             --bg-cream: #FAF7F2;
             --bg-warm: #F7EDE2;
             --accent: #B87D5E;
             --accent-light: #F5E6D3;
             --secondary: #6B8E9F;
             --brown: #3D322B;
             --brown-light: #6D6258;
             --card: #FFFFFF;
             --shadow: 0 12px 40px rgba(61, 50, 43, 0.12);
             --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
             --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
         }

         * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

         body {
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
             background: var(--bg-cream);
             color: var(--brown);
             line-height: 1.6;
             min-height: 100vh;
             padding-bottom: env(safe-area-inset-bottom, 0);
             overflow-x: hidden;
             position: relative;
         }

         /* 背景网格点阵缓慢平移 */
         body::before {
             content: "";
             position: fixed;
             inset: 0;
             background-image: radial-gradient(circle, rgba(184, 125, 94, 0.07) 1px, transparent 1px);
             background-size: 28px 28px;
             pointer-events: none;
             z-index: -1;
             animation: bgPan 20s linear infinite;
         }

         @keyframes bgPan {
             0% { background-position: 0 0; }
             100% { background-position: 28px 28px; }
         }

         /* 顶部 banner */
         .top-banner {
             position: relative;
             background: linear-gradient(135deg, #F0DED0 0%, #F7E9DA 40%, #F5E6D3 100%);
             background-size: 200% 200%;
             padding: 48px 20px 76px;
             text-align: center;
             animation: gradientFlow 10s ease infinite;
         }

         @keyframes gradientFlow {
             0% { background-position: 0% 50%; }
             50% { background-position: 100% 50%; }
             100% { background-position: 0% 50%; }
         }

         /* 波浪底部 */
         .wave {
             position: absolute;
             bottom: -1px;
             left: 0;
             width: 100%;
             height: 48px;
             fill: var(--bg-cream);
         }

         .wave path {
             animation: waveMove 6s ease-in-out infinite alternate;
         }

         @keyframes waveMove {
             0% { transform: translateX(-30px); }
             100% { transform: translateX(30px); }
         }

         .shop-name {
             display: inline-flex;
             align-items: center;
             gap: 8px;
             font-size: 15px;
             font-weight: 500;
             color: var(--accent);
             background: rgba(255,255,255,0.85);
             backdrop-filter: blur(8px);
             padding: 7px 16px;
             border-radius: 999px;
             margin-bottom: 16px;
             box-shadow: 0 4px 14px rgba(184, 125, 94, 0.12);
             animation: scaleIn 0.6s 0.1s var(--ease-spring) both;
         }

         h1 {
             font-size: 32px;
             font-weight: 800;
             color: var(--brown);
             margin-bottom: 8px;
             letter-spacing: 0.04em;
         }

         h1 span {
             display: inline-block;
             opacity: 0;
             transform: translateY(24px) scale(0.9);
             animation: charPop 0.5s var(--ease-spring) forwards;
         }

         @keyframes charPop {
             to { opacity: 1; transform: translateY(0) scale(1); }
         }

         .tagline {
             font-size: 14px;
             color: var(--brown-light);
             opacity: 0;
             animation: fadeInUp 0.6s 0.6s var(--ease-out) forwards;
         }

         @keyframes fadeInUp {
             from { opacity: 0; transform: translateY(20px); }
             to { opacity: 1; transform: translateY(0); }
         }

         @keyframes scaleIn {
             from { opacity: 0; transform: scale(0.8); }
             to { opacity: 1; transform: scale(1); }
         }

         .container {
             position: relative;
             z-index: 1;
             max-width: 480px;
             margin: -42px auto 0;
             padding: 0 18px;
         }

         .steps {
             display: flex;
             justify-content: center;
             gap: 10px;
             margin-bottom: 26px;
             flex-wrap: wrap;
         }

         .step {
             display: flex;
             align-items: center;
             gap: 6px;
             font-size: 13px;
             color: var(--brown-light);
             background: #fff;
             padding: 8px 14px;
             border-radius: 999px;
             box-shadow: 0 3px 10px rgba(61, 50, 43, 0.06);
             opacity: 0;
             transform: translateY(-20px);
             animation: dropIn 0.5s var(--ease-spring) forwards;
         }

         .step:nth-child(1) { animation-delay: 0.7s; }
         .step:nth-child(2) { animation-delay: 0.8s; }
         .step:nth-child(3) { animation-delay: 0.9s; }

         @keyframes dropIn {
             to { opacity: 1; transform: translateY(0); }
         }

         .step-num {
             width: 20px;
             height: 20px;
             display: grid;
             place-items: center;
             font-size: 11px;
             font-weight: 700;
             color: #fff;
             background: var(--accent);
             border-radius: 50%;
         }

         .card {
             position: relative;
             background: var(--card);
             border-radius: 24px;
             padding: 28px 24px;
             margin-bottom: 20px;
             box-shadow: var(--shadow);
             text-align: center;
             opacity: 0;
             transform: translateY(40px) rotateX(8deg);
             transform-origin: center top;
             animation: cardEnter 0.8s var(--ease-out) forwards;
             transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
         }

         .card:first-of-type { animation-delay: 0.9s; }
         .card:last-of-type { animation-delay: 1.2s; }

         @keyframes cardEnter {
             to { opacity: 1; transform: translateY(0) rotateX(0); }
         }

         .card:active {
             transform: scale(0.98);
         }

         .card-header {
             margin-bottom: 20px;
         }

         .card-title {
             font-size: 21px;
             font-weight: 700;
             color: var(--brown);
             margin-bottom: 6px;
         }

         .card-subtitle {
             font-size: 13px;
             color: var(--brown-light);
             line-height: 1.7;
         }

         .qr-frame {
             display: inline-block;
             position: relative;
             background: #fff;
             border: 1px solid #EDE5DB;
             border-radius: 18px;
             padding: 12px;
             box-shadow: 0 6px 20px rgba(61, 50, 43, 0.08), inset 0 0 0 1px rgba(255,255,255,0.8);
         }

         /* 双层发光脉冲 */
         .qr-frame::before,
         .qr-frame::after {
             content: "";
             position: absolute;
             inset: -8px;
             border-radius: 26px;
             border: 2px solid var(--accent);
             opacity: 0;
             pointer-events: none;
         }

         .qr-frame::before {
             animation: glowRing 2.5s 1.2s ease-out infinite;
         }

         .qr-frame::after {
             animation: glowRing 2.5s 1.8s ease-out infinite;
         }

         @keyframes glowRing {
             0% { opacity: 0; transform: scale(0.92); }
             20% { opacity: 0.5; }
             100% { opacity: 0; transform: scale(1.06); }
         }

         .qr-frame img {
             display: block;
             width: 260px;
             height: auto;
             max-width: 100%;
             border-radius: 10px;
         }

         .action-pill {
             position: relative;
             display: inline-flex;
             align-items: center;
             gap: 6px;
             margin-top: 18px;
             background: linear-gradient(135deg, var(--accent) 0%, #C96A4E 100%);
             color: #fff;
             font-size: 15px;
             font-weight: 600;
             padding: 12px 26px;
             border-radius: 999px;
             box-shadow: 0 6px 20px rgba(184, 125, 94, 0.3);
             overflow: hidden;
             opacity: 0;
             transform: scale(0.9);
             animation: pillEnter 0.5s 1.1s var(--ease-spring) forwards, float 3s 1.6s ease-in-out infinite;
         }

         .card-alt .action-pill {
             background: linear-gradient(135deg, var(--secondary) 0%, #5A7D8C 100%);
             box-shadow: 0 6px 20px rgba(107, 142, 159, 0.25);
             animation: pillEnter 0.5s 1.4s var(--ease-spring) forwards, float 3s 1.9s ease-in-out infinite;
         }

         @keyframes pillEnter {
             to { opacity: 1; transform: scale(1); }
         }

         @keyframes float {
             0%, 100% { transform: translateY(0); }
             50% { transform: translateY(-5px); }
         }

         /* 扫光效果 */
         .action-pill::before {
             content: "";
             position: absolute;
             top: 0;
             left: -100%;
             width: 60%;
             height: 100%;
             background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
             transform: skewX(-20deg);
             animation: shimmer 3s 2s infinite;
         }

         @keyframes shimmer {
             0% { left: -100%; }
             40%, 100% { left: 200%; }
         }

         .hint {
             margin-top: 14px;
             font-size: 12px;
             color: var(--brown-light);
         }

         .card-alt {
             background: linear-gradient(180deg, #FAF9F7 0%, #F5F4F2 100%);
             border: 1px solid #E8E5E1;
         }

         .card-alt .card-title {
             color: var(--secondary);
         }

         .card-alt .qr-frame {
             border-color: #DDE5E8;
         }

         .card-alt .qr-frame::before,
         .card-alt .qr-frame::after {
             border-color: var(--secondary);
         }

         .divider {
             display: flex;
             align-items: center;
             gap: 12px;
             margin: 8px 0 20px;
             color: #B0A69C;
             font-size: 12px;
             opacity: 0;
             animation: fadeInUp 0.5s 1.1s var(--ease-out) forwards;
         }

         .divider::before, .divider::after {
             content: "";
             flex: 1;
             height: 1px;
             background: linear-gradient(90deg, transparent, #D8CFC5, transparent);
         }

         .footer {
             text-align: center;
             padding: 16px 20px 36px;
             font-size: 12px;
             color: #A69B90;
             line-height: 1.8;
             opacity: 0;
             animation: fadeInUp 0.5s 1.4s var(--ease-out) forwards;
         }

         @media (prefers-reduced-motion: reduce) {
             *, *::before, *::after {
                 animation-duration: 0.01ms !important;
                 animation-iteration-count: 1 !important;
                 transition-duration: 0.01ms !important;
             }
         }

         @media (max-width: 360px) {
             h1 { font-size: 28px; }
             .qr-frame img { width: 220px; }
             .card { padding: 24px 18px; }
         }
     </style>
 </head>
 <body>

     <div class="top-banner">
         <div class="shop-name">🛏️ 床上用品店</div>
         <h1>
             <span style="animation-delay:0.2s">盛</span>
             <span style="animation-delay:0.28s">达</span>
             <span style="animation-delay:0.36s">布</span>
             <span style="animation-delay:0.44s">业</span>
         </h1>
         <p class="tagline">床单被罩 · 凉席蚊帐 · 电热毯 · 到货实拍通知</p>
         <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none">
             <path d="M0,48 C360,0 1080,96 1440,48 L1440,120 L0,120 Z"></path>
         </svg>
     </div>

     <div class="container">
         <div class="steps">
             <div class="step"><span class="step-num">1</span>长按二维码</div>
             <div class="step"><span class="step-num">2</span>识别图中二维码</div>
             <div class="step"><span class="step-num">3</span>加入群聊</div>
         </div>

         <div class="card">
             <div class="card-header">
                 <div class="card-title">📸 床品到货实拍群</div>
                 <div class="card-subtitle">新到床单、被罩、枕巾、枕套、凉席、电热毯、蚊帐等，第一时间拍照发群，看中再来店里取</div>
             </div>
             <div class="qr-frame">
                 <img src="qrcode_a_20260811.png" alt="床品到货群二维码" width="277" height="400">
             </div>
             <div class="action-pill">👆 长按识别二维码加群</div>
             <div class="hint">若提示群已满，请用下方方式联系老板</div>
         </div>

         <div class="divider">备用通道</div>

         <div class="card card-alt">
             <div class="card-header">
                 <div class="card-title">🙋 群满或过期？</div>
                 <div class="card-subtitle">添加老板微信，手动拉您进群，或直接发图看款</div>
             </div>
             <div class="qr-frame">
                 <img src="qrcode_b_20260811.png" alt="老板微信二维码" width="277" height="400">
             </div>
             <div class="action-pill">👆 长按识别添加好友</div>
         </div>
     </div>

     <div class="footer">
         群二维码每周更新 · 欢迎街坊邻里常来逛逛<br>
         床品看好了再来取，省心又方便
     </div>

 </body>
 </html>
